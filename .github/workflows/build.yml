on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build'
        required: true
      draft_release:
        description: 'Draft a release'
        required: false
        default: true
jobs:
  env:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: myxo/statshouse
          ref: ${{ github.event.inputs.tag }}
          fetch-depth: 0
      - id: main
        run: |
          BUILD_COMMIT=$(git log --format="%H" -n 1)
          BUILD_COMMIT_TS=$(git log --format="%ct" -n 1)
          BUILD_TIME=$(date +%FT%T%z)
          BUILD_VERSION=$(git describe --tags --always --dirty)
          BUILD_VERSION=${BUILD_VERSION#v}
          echo "BUILD_COMMIT=$BUILD_COMMIT" >> "$GITHUB_OUTPUT"
          echo "BUILD_COMMIT_TS=$BUILD_COMMIT_TS" >> "$GITHUB_OUTPUT"
          echo "BUILD_TIME=$BUILD_TIME" >> "$GITHUB_OUTPUT"
          echo "BUILD_VERSION=$BUILD_VERSION" >> "$GITHUB_OUTPUT"
    outputs:
      ref: ${{ steps.main.outputs.BUILD_COMMIT }}
      ref_timestamp: ${{ steps.main.outputs.BUILD_COMMIT_TS }}
      timestamp: ${{ steps.main.outputs.BUILD_TIME }}
      version: ${{ steps.main.outputs.BUILD_VERSION }}
  binaries:
    needs: env
    strategy:
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    uses: ./.github/workflows/build_binaries.yml
    with:
      runs-on: ${{ matrix.runner }}
      container_json: '{"image":"golang:1.23-bullseye"}'
      setup-go: false
      ref: ${{ needs.env.outputs.ref }}
      ref_timestamp: ${{ needs.env.outputs.ref_timestamp }}
      timestamp: ${{ needs.env.outputs.timestamp }}
      version: ${{ needs.env.outputs.version }}
      name: linux
      release: ${{ matrix.arch }}
  frontend:
    needs: env
    runs-on: ubuntu-latest
    container:
      image: node:18
    steps:
      - uses: actions/checkout@v5
        with:
          repository: myxo/statshouse
          ref: ${{needs.env.outputs.ref}}
          fetch-depth: 0
      - run: echo "REACT_APP_BUILD_VERSION=${{needs.env.outputs.version}}-${{needs.env.outputs.timestamp}}" >> $GITHUB_ENV
      - run: make build-sh-ui
      - uses: actions/upload-artifact@v4
        with:
          name: statshouse-ui-${{needs.env.outputs.version}}
          path: |
            statshouse-ui/build
            .dummy_preserves_directory_structure
    outputs:
      artifact: statshouse-ui-${{needs.env.outputs.version}}
  deb:
    strategy:
      matrix:
        # release: [debian-bullseye, debian-bookworm, ubuntu-focal, ubuntu-jammy]
        include:
          - release: ubuntu-focal
            runner: ubuntu-latest
            arch: amd64
          - release: ubuntu-focal
            runner: ubuntu-24.04-arm
            arch: arm64
    needs: [env]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          repository: myxo/statshouse
          ref: ${{needs.env.outputs.ref}}
          fetch-depth: 0
      - run: build/make-pkg.sh ${{matrix.release}}
      - uses: actions/upload-artifact@v4
        with:
          name: statshouse-pkg-${{needs.env.outputs.version}}-${{github.run_number}}-${{matrix.release}}-${{matrix.arch}}
          path: target/${{matrix.release}}/*.deb
  draft_release:
    if: ${{ github.event.inputs.draft_release }}
    needs: [env, deb]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          repository: myxo/statshouse
          ref: ${{needs.env.outputs.ref}}
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          pattern: statshouse-pkg-*
          path: pkg/
      - run: gh release create --draft --generate-notes --title "${{github.event.inputs.tag}}" ${{github.event.inputs.tag}} $(find ./pkg -type f -name *.deb)
        env:
          GITHUB_TOKEN: ${{secrets.DEVTOOLS_GITHUB_TOKEN}}
